[project]
name = "yplayer"
version = "0.1.0"
description = "CLI YouTube audio cache + player (audio-only via yt-dlp)."
authors = [ { name = "You" } ]
requires-python = ">=3.9"
dependencies = [
  "yt-dlp",
  "python-dotenv",
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
yplay-worker = "yplayer.worker:main"

[tool.setuptools.packages.find]
include = ["yplayer*"]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
