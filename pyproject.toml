[project]
name = "yplayer"
version = "0.1.0"
description = "CLI YouTube audio cache + player (audio-only via yt-dlp)."
authors = [ { name = "You" } ]
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]",
  "python-dotenv",
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
yplay-worker = "yplayer.worker:main"

[tool.setuptools.packages.find]
include = ["yplayer*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# High-signal only: pyflakes (F, catches unused/undefined imports — the class
# of bug that broke HEAD), import sorting (I), and pyupgrade (UP). Skip the
# noisy pycodestyle line-length lints.
select = ["F", "I", "UP"]

[tool.pytest.ini_options]
# Network tests are opt-in: `pytest -m live`.
markers = ["live: needs the network (real yt-dlp download)"]
addopts = "-m 'not live'"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
