name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Hard gates: the code must build, pass its tests, and stay formatted.
      - name: Format check
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install from pyproject.toml in a clean environment so an undeclared
      # dependency (the python-dotenv gap that broke HEAD) fails loudly.
      - name: Install
        run: pip install .[dev]
      - name: Ruff
        run: ruff check yplayer/
      - name: Smoke + protocol tests
        run: pytest -q
