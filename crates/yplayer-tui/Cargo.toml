[package]
name = "yplayer-tui"
version = "0.2.0"
edition = "2024"
description = "Fast terminal YouTube audio player — Rust TUI with Ratatui"

[[bin]]
name = "yplay"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "io-util",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
walkdir = "2"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
anyhow = "1"
which = "8"
rand = "0.10"

[dev-dependencies]
tempfile = "3"
